        function loadAudioForCurrentChapter() {
            if (!audioData || currentBookIndex === null || currentChapter === null) {
                document.getElementById('audioInfo').textContent = 'No audio available';
                return;
            }

            // Find the book in audio data
            const bookData = audioData.find(book => book.book === currentBookName);

            if (!bookData) {
                const audioInfo = document.getElementById('audioInfo');
                if (audioInfo) {
                    audioInfo.textContent = 'No audio for this book';
                }
                return;
            }

            // Find the chapter audio
            const chapterData = bookData.chapters.find(ch => ch.chapter === currentChapter);

            if (!chapterData || !chapterData.audioUrl || chapterData.audioUrl === '') {
                const audioInfo = document.getElementById('audioInfo');
                if (audioInfo) {
                    audioInfo.textContent = `${currentBookName} ${currentChapter} - No audio available`;
                }
                currentAudioUrl = '';
                return;
            }

            // Load the audio
            currentAudioUrl = chapterData.audioUrl;

            // Force reload to fix potential TV browser issues
            audioElement.pause();
            audioElement.src = '';
            audioElement.load();

            // Try to fix Dropbox links - convert to direct download format
            let fixedUrl = currentAudioUrl;
            if (fixedUrl.includes('dropbox.com')) {
                // Change dl=0 to dl=1 for direct download
                fixedUrl = fixedUrl.replace('dl=0', 'dl=1');
                // Also try raw parameter
                if (!fixedUrl.includes('dl=1') && !fixedUrl.includes('raw=1')) {
                    fixedUrl += (fixedUrl.includes('?') ? '&' : '?') + 'raw=1';
                }
            }

            audioElement.src = fixedUrl;
            audioElement.load(); // Force load
            audioElement.volume = 1.0; // Ensure volume
            audioElement.muted = false; // Ensure unmuted
            audioElement.playbackRate = playbackSpeeds[currentSpeedIndex];

            const audioInfo = document.getElementById('audioInfo');
            const audioPlayBtn = document.getElementById('audioPlayBtn');
            if (audioInfo) audioInfo.textContent = `${currentBookName} ${currentChapter}`;
            if (audioPlayBtn) audioPlayBtn.textContent = '▶ Play';

            // Display the URL for debugging
            const urlDisplay = document.getElementById('audioUrlDisplay');
            if (urlDisplay) {
                urlDisplay.textContent = 'Audio URL: ' + fixedUrl.substring(0, 80) + '...';
            }

            // Auto-play if enabled
            if (autoPlayEnabled && isAudioPlayerVisible) {
                setTimeout(() => {
                    audioElement.play().catch(err => {
                        console.log('Auto-play prevented:', err);
                    });
                }, 300);
            }
        }

        // Toggle play/pause
        function toggleAudio() {
            if (!audioElement || !currentAudioUrl) {
                const audioInfo = document.getElementById('audioInfo');
                if (audioInfo) {
                    audioInfo.textContent = 'No audio URL available';
                    audioInfo.style.color = '#ff6b6b';
                }
                return;
            }

            if (audioElement.paused) {
                const audioInfo = document.getElementById('audioInfo');
                if (audioInfo) {
                    audioInfo.style.color = 'white';
                }

                // Force unmute and volume before playing (LG TV fix)
                audioElement.muted = false;
                audioElement.volume = 1.0;

                audioElement.play()
                    .then(() => {
                        const audioPlayBtn = document.getElementById('audioPlayBtn');
                        const audioInfo = document.getElementById('audioInfo');
                        if (audioPlayBtn) audioPlayBtn.textContent = '⏸ Pause';
                        if (audioInfo) audioInfo.textContent = `${currentBookName} ${currentChapter} - Playing`;

                        // Double-check volume after play starts (LG TV workaround)
                        setTimeout(() => {
                            audioElement.volume = 1.0;
                            audioElement.muted = false;
                        }, 100);
                    })
                    .catch(err => {
                        const audioInfo = document.getElementById('audioInfo');
                        const audioPlayBtn = document.getElementById('audioPlayBtn');
                        if (audioInfo) {
                            audioInfo.textContent = 'Playback failed: ' + err.message;
                            audioInfo.style.color = '#ff6b6b';
                        }
                        if (audioPlayBtn) audioPlayBtn.textContent = '▶ Play';
                    });
            } else {
                audioElement.pause();
                const audioPlayBtn = document.getElementById('audioPlayBtn');
                const audioInfo = document.getElementById('audioInfo');
                if (audioPlayBtn) audioPlayBtn.textContent = '▶ Play';
                if (audioInfo) audioInfo.textContent = `${currentBookName} ${currentChapter} - Paused`;
            }
        }

        // Reload audio
        function reloadAudio() {
            if (!currentAudioUrl) {
                document.getElementById('audioInfo').textContent = 'No audio to reload';
                document.getElementById('audioInfo').style.color = '#ff6b6b';
                return;
            }

            // Stop current playback
            audioElement.pause();
            audioElement.currentTime = 0;

            // Clear and reload
            audioElement.src = '';
            audioElement.load();

            // Reload the URL
            setTimeout(() => {
                // Try to fix Dropbox links - convert to direct download format
                let fixedUrl = currentAudioUrl;
                if (fixedUrl.includes('dropbox.com')) {
                    // Change dl=0 to dl=1 for direct download
                    fixedUrl = fixedUrl.replace('dl=0', 'dl=1');
                    // Also try raw parameter
                    if (!fixedUrl.includes('dl=1') && !fixedUrl.includes('raw=1')) {
                        fixedUrl += (fixedUrl.includes('?') ? '&' : '?') + 'raw=1';
                    }
                }

                audioElement.src = fixedUrl;
                audioElement.load();
                audioElement.volume = 1.0;
                audioElement.muted = false;

                document.getElementById('audioInfo').textContent = `${currentBookName} ${currentChapter} - Reloaded`;
                document.getElementById('audioInfo').style.color = 'white';
                document.getElementById('audioPlayBtn').textContent = '▶ Play';

                // Show feedback
                const reloadBtn = document.getElementById('audioReloadBtn');
                const originalText = reloadBtn.textContent;
                reloadBtn.textContent = '✓';
                setTimeout(() => {
                    reloadBtn.textContent = originalText;
                }, 1000);
            }, 100);
        }

        // Cycle through playback speeds
        function cycleSpeed() {
            currentSpeedIndex = (currentSpeedIndex + 1) % playbackSpeeds.length;
            const speed = playbackSpeeds[currentSpeedIndex];
            audioElement.playbackRate = speed;
            document.getElementById('audioSpeedBtn').textContent = speed + 'x';
            saveAudioPreferences();
        }

        // Seek audio by clicking on progress bar
        function seekAudio(event) {
            if (!audioElement || !currentAudioUrl) return;

            const progressContainer = document.getElementById('audioProgressContainer');
            const rect = progressContainer.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const percentage = clickX / rect.width;
            const newTime = percentage * audioElement.duration;

            audioElement.currentTime = newTime;
        }

        // Format time in MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        // Save audio preferences to localStorage
        function saveAudioPreferences() {
            localStorage.setItem('audioPlayerVisible', isAudioPlayerVisible.toString());
            localStorage.setItem('audioSpeedIndex', currentSpeedIndex.toString());
            localStorage.setItem('audioAutoPlay', autoPlayEnabled.toString());
        }

        // Load audio preferences from localStorage
        function loadAudioPreferences() {
            const savedVisible = localStorage.getItem('audioPlayerVisible');
            const savedSpeedIndex = localStorage.getItem('audioSpeedIndex');
            const savedAutoPlay = localStorage.getItem('audioAutoPlay');

            if (savedVisible === 'true') {
                // Restore audio player visibility
                setTimeout(() => {
                    toggleAudioPlayer();
                }, 500);
            }

            if (savedSpeedIndex !== null) {
                currentSpeedIndex = parseInt(savedSpeedIndex);
                const speed = playbackSpeeds[currentSpeedIndex];
                if (audioElement) {
                    audioElement.playbackRate = speed;
                }
                document.getElementById('audioSpeedBtn').textContent = speed + 'x';
            }

            if (savedAutoPlay !== null) {
                autoPlayEnabled = savedAutoPlay === 'true';
            }
        }

        // Show audio format support diagnostic
        function showAudioDebug() {
            const audio = document.createElement('audio');
            let debugInfo = 'AUDIO FORMAT SUPPORT:\n\n';

            const formats = {
                'MP3': 'audio/mpeg',
                'OGG': 'audio/ogg',
                'WAV': 'audio/wav',
                'AAC': 'audio/aac',
                'M4A': 'audio/mp4',
                'WEBM': 'audio/webm'
            };

            for (let format in formats) {
                const support = audio.canPlayType(formats[format]);
                debugInfo += format + ': ' + (support === 'probably' ? '✓ YES' : support === 'maybe' ? '? MAYBE' : '✗ NO') + '\n';
            }

            debugInfo += '\nCURRENT AUDIO URL:\n' + (currentAudioUrl || 'None');

            debugInfo += '\n\nAUDIO ELEMENT STATE:\n';
            debugInfo += 'Ready State: ' + (audioElement ? audioElement.readyState : 'No element') + '\n';
            debugInfo += 'Network State: ' + (audioElement ? audioElement.networkState : 'No element') + '\n';
            debugInfo += 'Paused: ' + (audioElement ? audioElement.paused : 'N/A') + '\n';
            debugInfo += 'Duration: ' + (audioElement ? audioElement.duration : 'N/A') + '\n';
            debugInfo += 'Volume: ' + (audioElement ? audioElement.volume : 'N/A') + '\n';
            debugInfo += 'Muted: ' + (audioElement ? audioElement.muted : 'N/A') + '\n';
            debugInfo += 'Current Time: ' + (audioElement ? audioElement.currentTime : 'N/A') + '\n';

            alert(debugInfo);
        }

        // Load data when page loads
        window.addEventListener('DOMContentLoaded', function() {
            loadFontSize();
            loadBibleData();
            loadAutoScrollPreference();
            loadViewMode();
            loadDarkMode();
            loadTranslationPreference();
            initAudioPlayer();

            // Setup toggle listeners
            const autoScrollToggle = document.getElementById('autoScrollToggle');
            autoScrollToggle.addEventListener('change', toggleAutoScroll);

            const translationRadios = document.querySelectorAll('input[name="translationRadio"]');
            translationRadios.forEach(radio => {
                radio.addEventListener('change', toggleTranslation);
            });
        });
    </script>
</body>
</html>
